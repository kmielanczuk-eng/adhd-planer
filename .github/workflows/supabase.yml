name: Wdrożenie Supabase (baza + funkcja push)

# Uruchamia się ręcznie (Actions → ten workflow → Run workflow) albo po zmianach w supabase/.
# Wymaga sekretów repozytorium: SUPABASE_ACCESS_TOKEN i SUPABASE_DB_PASSWORD.
# Bez nich kończy się bez błędu i nic nie robi.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['supabase/**']

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: rpalciokigpaqfprgczv
    steps:
      - uses: actions/checkout@v4
      - name: Sprawdź sekrety
        id: check
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Brak sekretu SUPABASE_ACCESS_TOKEN — pomijam (instrukcja w RANO_ZROB_TO.md)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.ok == 'true'
        with:
          version: latest
      - name: Migracja bazy
        if: steps.check.outputs.ok == 'true' && env.SUPABASE_DB_PASSWORD != ''
        run: |
          supabase link --project-ref "$PROJECT_REF" -p "$SUPABASE_DB_PASSWORD"
          supabase db push -p "$SUPABASE_DB_PASSWORD" --include-all
      - name: Wdrożenie funkcji push
        if: steps.check.outputs.ok == 'true'
        run: supabase functions deploy push --project-ref "$PROJECT_REF" --no-verify-jwt
      - name: Test funkcji (klucz VAPID)
        if: steps.check.outputs.ok == 'true'
        run: curl -fsS "https://$PROJECT_REF.supabase.co/functions/v1/push?action=vapid"
