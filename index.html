<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f4ef" />
    <meta name="description" content="Prywatny planer, to-do i notatnik przyjazny głowie z ADHD." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Ogarniacz" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>Ogarniacz</title>
    <script>
      // Motyw przed pierwszym renderem — bez mrugnięcia jasnym ekranem w nocy.
      try {
        var s = JSON.parse(localStorage.getItem('ogarniacz:settings') || '{}');
        var t = s.theme || 'system';
        if (t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Ta aplikacja potrzebuje JavaScriptu.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
